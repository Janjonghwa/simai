spring:
  datasource:
    hikari:
      # 시험 컨텍스트마다 풀을 열어 둔다(캐시). 기본 10개면 여러 세션이 같은 시험 DB 서버(max_connections 100)에서 동시에 빌드할 때
      # "too many clients" 로 컨텍스트가 뜨지 못한다(S15P31A101-70). 시험은 차례로 돌아 4개면 충분하다
      maximum-pool-size: 4
      minimum-idle: 1
simai:
  health:
    # 시험은 끊김을 빨리 본다(운영 3초)
    link-timeout-ms: 1500
    # 시험 컨텍스트가 여럿이라, Tier 0·노트북을 둘 다 받은 컨텍스트만 장애를 기록한다(열린 장애는 하나)
    outage-startup-grace-ms: 3600000
  metrics:
    # 시험은 표본을 직접 부른다(SystemMetricIntegrationTest). 주기 표본이 다른 시험 도중 행을 넣지 않게 길게 둔다
    ec2-interval: 1h
  auth:
    jwt:
      # 시험 전용 키(Base64, 37바이트). 운영 값이 아니다
      secret: dGVzdC1vbmx5LXNpbWFpLWp3dC1zZWNyZXQtMzItYnl0ZXMhIQ==
  config-bundle:
    public-base-url: https://ec2.test
  storage:
    # 서명은 계산만 하므로 저장소가 없어도 된다(UploadSignIntegrationTest). 시험 전용 값이다
    bucket: simai-test-bucket
    endpoint: http://127.0.0.1:9000
    path-style: true
    access-key: test-only-access-key
    secret-key: test-only-secret-key
  floor-plan:
    # 시험은 대조를 직접 부른다(FloorPlanIntegrationTest). 주기 대조가 다른 시험 도중 작업을 넣지 않게 길게 둔다
    reconcile-interval: 1h
  tier0:
    # 시험 전용 토큰 "test-only-tier0-token" 의 SHA-256(Tier0I1IntegrationTest). 운영 값이 아니다
    token-sha256: 8c9cd5d871e96b937393e4eeb379dc39b7a894759fa7baa27b3762261baf9e08
  clip:
    # 시험은 클립 삭제 작업을 직접 부른다(ClipPurgeIntegrationTest). 주기 작업이 다른 시험의 행을 건드리지 않게 미룬다
    purge-initial-delay: PT24H
  cctv-remote:
    # 시험은 시청자 상한·수요 끄기를 빨리 본다(CctvRemoteIntegrationTest). 사용 기록은 시험이 직접 부른다
    max-viewers: 2
    demand-linger: 400ms
    usage-flush-interval: 1h
