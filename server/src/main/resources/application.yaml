spring:
  application:
    name: simai
  datasource:
    # 값은 환경 변수로 받는다. SPRING_DATASOURCE_* 가 있으면 그 값이 먼저다(CI)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/simai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    # 요청 끝까지 영속성 문맥(과 DB 연결)을 붙잡지 않는다. 엔티티는 AppUser·RefreshToken 뿐이고 지연 로딩 연관이 없다
    open-in-view: false
    hibernate:
      # 스키마는 Flyway(V1~) 만 만든다. JPA 는 엔티티가 테이블과 맞는지 기동 때 검사만 한다
      ddl-auto: validate
  mvc:
    # 오류 본문을 ProblemDetail(detail) 로 준다. 프론트 http.ts 가 detail 을 읽는다
    problemdetails:
      enabled: true

springdoc:
  # Nginx 가 /api/ 만 서버로 넘기므로 문서도 /api/docs 아래에 둔다(설정 변경 없이 운영에서도 열린다)
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /api/docs
  # 문서에는 /api 만 싣는다(/error 등 제외)
  paths-to-match: /api/**

simai:
  auth:
    jwt:
      # HS256 서명 키. Base64 로 32바이트 이상. 값은 환경 변수·비밀 저장소에만 둔다(명세 14)
      secret: ${SIMAI_JWT_SECRET:}
      # 짧게 두고 갱신 토큰으로 다시 받는다. 막힌 계정의 토큰이 살아 있는 시간도 이만큼이다
      access-token-ttl: 30m
    refresh-token:
      # 반장 PWA 가 관제 중 다시 로그인하지 않게 길게 둔다(명세 14, FR-35). 갱신마다 새 토큰으로 바꾼다
      ttl: 14d
      # HttpOnly 쿠키로만 주고받는다. https 가 아닌 로컬 시험(Postman 등)에서만 false 로 둔다
      cookie-secure: ${SIMAI_REFRESH_COOKIE_SECURE:true}
    # 관제 앱 개발 서버(Vite)가 다른 포트에서 부른다. 운영은 같은 출처라 비워 둔다
    cors-allowed-origins: ${SIMAI_CORS_ALLOWED_ORIGINS:}
  metrics:
    # EC2 자체 지표(Micrometer)를 system_metric 에 남기는 주기(S15P31A101-70). Tier 0 지표는 health 를 받을 때마다 남는다
    ec2-interval: 10s
  setup:
    # 미리보기 맵 전 세팅 작업을 GPU 워커가 이만큼 가져가지 않으면 세션을 SETUP_QUEUE_TIMEOUT 으로 닫는다(S15P31A101-641).
    # GPU 인스턴스를 켜고 워커가 붙는 시간보다 넉넉히 둔다
    queue-timeout: 10m
    queue-check-interval: 30s
    # 시연 계정 user_id(쉼표로 이음). 이 계정은 「이전 맵 재사용」에서 카메라 시점 확인 없이 완료된 맵을 모두 고르고 추천을 받지 않는다(SetupDemoAccounts).
    # 실서버 시연 계정은 user_id 1 이다(프론트 features/demo/demoAccount 와 같다)
    demo-user-ids: ${SIMAI_DEMO_USER_IDS:1}
  floor-plan:
    # 보정 CALIBRATED·버전 변경을 보고 BEV 평면도 작업을 넣는 대조 주기(S15P31A101-240). 평면도는 BACKGROUND 라 몇 초 늦어도 된다
    reconcile-interval: 10s
  config-bundle:
    # Tier 0 가 구성 묶음을 내려받는 공개 주소(https://<도메인>). 묶음 안 구성 요소 주소가 이것으로 시작한다. 비어 있으면 발행하지 않는다
    public-base-url: ${SIMAI_PUBLIC_BASE_URL:}
  storage:
    # 객체 저장소(S3 또는 S3 호환 Lightsail 버킷, 비공개). 비어 있으면 업로드·조회 서명 주소를 내지 않는다(503)
    bucket: ${SIMAI_STORAGE_BUCKET:}
    region: ${SIMAI_STORAGE_REGION:ap-northeast-2}
    # endpoint·path-style 은 로컬 S3 호환 저장소(MinIO 등)만
    endpoint: ${SIMAI_STORAGE_ENDPOINT:}
    path-style: ${SIMAI_STORAGE_PATH_STYLE:false}
    # 비우면 기본 공급자(인스턴스 역할 등)로 서명한다. 운영 EC2 는 SSAFY 제공이라 역할을 붙일 수 없어 IAM 사용자 키를 넣는다
    access-key: ${SIMAI_STORAGE_ACCESS_KEY:}
    secret-key: ${SIMAI_STORAGE_SECRET_KEY:}
    # 서명 주소 수명. 업로더는 시도마다 새로 받는다
    upload-ttl: 5m
    download-ttl: 5m
  scene:
    # Scene 생성(정적 3D, M3) 전 관제 화면 배경으로 줄 시연용 기본 glTF 의 객체 키(버킷 안). 비어 있으면 GET /api/scenes/current 가 404
    default-gltf-key: ${SIMAI_SCENE_DEFAULT_GLTF_KEY:}
    default-version: scene-demo
  tier0:
    # Tier 0 토큰(Tier 0 의 SIMAI_TIER0_TOKEN) 원문의 SHA-256 16진수. 손으로 켠 세션용이다. 비어 있으면 GPU 세션이 발급한 토큰만 받는다
    token-sha256: ${SIMAI_TIER0_TOKEN_SHA256:}
  gpu-session:
    # GPU 세션 등록(S15P31A101-699, 설계 docs/design/S15P31A101-699-gpu-session-register.md). 인스턴스에 권하는 진행 보고 간격
    report-interval: 60s
    # 마지막 보고 뒤 이만큼 보고가 없고 그 세션 Tier 0 의 I1 연결도 없으면 세션을 끝내고 토큰을 폐기한다.
    # 보고 10번을 놓친 시간이다: EC2 재배포(약 1~2분)·망 끊김을 견디고, 죽은 인스턴스 토큰이 살아 있는 시간을 10분으로 묶는다
    stale-after: 10m
    sweep-interval: 30s
    # 세션 Tier 0 에 줄 gateway_id. 저널 이어 받기가 이 값에 묶여 세션이 바뀌어도 같아야 한다(simai-bootstrap lobby 기본값과 같음)
    gateway-id: ${SIMAI_GPU_TIER0_GATEWAY_ID:tier0-lobby-s9}
  gpu:
    # GPU 켜기·끄기·자동 정지(S15P31A101-702, 설계 docs/design/S15P31A101-702-gpu-provider-runpod.md). 화면 「GPU 설정」(DB 버전)이
    # 선호 GPU·지역·가격 상한·자동 정지 분·템플릿 ID 를 정하고, 아래는 운영 고정값이다
    runpod:
      # RunPod API 키(비밀). EC2 .env 에만 둔다. 비면 켜기·재고 조회가 503 이고 자동 정지는 아무것도 하지 않는다
      api-key: ${SIMAI_RUNPOD_API_KEY:}
      # 인스턴스 환경 변수 SIMAI_GPU_BOOT_ID(비밀 아님, admin gpu-boot register --id). 부팅 비밀값 원문은 RunPod Secret 참조로만 넣는다
      boot-id: ${SIMAI_GPU_BOOT_ID:gpu-boot-runpod}
    aws:
      # AWS 서울 GPU(S15P31A101-703, 설계 docs/design/S15P31A101-703-aws-gpu-provider.md). 기본 꺼짐: 켜지 않으면 AWS 를 부르지 않고
      # 설정 화면·재고 표에 "준비 안 됨"이다. 시작 템플릿·서브넷·보안 그룹·인스턴스 종류·스팟은 화면 「GPU 설정」, 여기는 운영 고정값
      enabled: ${SIMAI_GPU_AWS_ENABLED:false}
      region: ${SIMAI_GPU_AWS_REGION:ap-northeast-2}
      # 전용 IAM 사용자 키(비밀, EC2 .env 에만). 비우면 AWS 기본 자격 증명 체인(인스턴스 역할 등)
      access-key: ${SIMAI_GPU_AWS_ACCESS_KEY_ID:}
      secret-key: ${SIMAI_GPU_AWS_SECRET_ACCESS_KEY:}
      # 인스턴스가 띄울 GPU 이미지(ECR 서울 사본, 다이제스트 고정). 비면 켜지 않는다
      image: ${SIMAI_GPU_AWS_IMAGE:}
      # 인스턴스가 역할로 읽는 Secrets Manager 비밀 이름(비밀 아님). 값은 JSON {SIMAI_GPU_BOOT_SECRET, SIMAI_TIER0_TLS_PRIVATE_KEY, HF_TOKEN, …}
      secret-id: ${SIMAI_GPU_AWS_SECRET_ID:simai/gpu-boot}
      # 인스턴스 컨테이너에 더 넣는 비밀 아닌 환경 변수(빈 값은 넣지 않는다). 이름을 그대로 두려고 대괄호로 쓴다
      extra-env:
        "[SIMAI_TIER0_GPU_RESERVE_MB]": "8192"
        "[SIMAI_TIER0_PINNED_SPKI_SHA256]": ${SIMAI_TIER0_PINNED_SPKI_SHA256:}
    # 켠 뒤 G1 등록이 이만큼 없으면 오류로 보고 끈다(목표 5~7분 기동 + 첫 엔진 빌드·이미지 받기 여유)
    boot-timeout: 25m
    # FAILED 를 이만큼 이어 보고하고 Tier 0 I1 도 없으면 끈다(-700: 인스턴스는 FAILED 면 스스로 끝내지 않고 기다린다)
    failed-grace: 20m
    # 녹화 조각 업로드 서명이 이만큼 안에 있었으면 업로드 중(deploy.sh SIMAI_DEPLOY_HOLD_UPLOAD_MINUTES 기본 10분과 같다)
    upload-hold: 10m
    sweep-interval: 60s
    # Tier 0 가 붙어 있을 때 관리자 화면 조작 신호(POST /api/gpu/presence)만으로 유휴 자동 정지를 미룰 수 있는 최대 시간(S15P31A101-774).
    # 마지막 실제 사용(실행 종료·세팅·작업 대여·업로드)과 준비 완료 중 늦은 시각부터 센다. 화면만 열어 둔 채 2시간 켜진 11-16 사례 대응,
    # 근거는 docs/design/S15P31A101-774-gpu-presence-visible-cap.md. LIVE·세팅·업로드·분석 작업 중에는 상관없이 끄지 않는다
    presence-max-extension: 90m
  replay-test:
    # 녹화 재생 시험 스위치(S15P31A101-736, docs/design/S15P31A101-736-replay-test-switch.md). AGENTS 규칙 5 의 시험용 예외라 기본 꺼짐, 화면 버튼 없음.
    # alerts: 켜면 노트북이 녹화 파일·합성 영상 입력을 알리는 동안에도 워치 진동을 보낸다(관제 화면 「재생 시험 · 실제 알림 켜짐」)
    alerts: ${SIMAI_REPLAY_TEST_ALERTS:false}
    # skip-camera-check: 켜고 노트북 카메라 입력이 모두 녹화 파일일 때만 세팅 카메라 확인 걷기를 건너뛴다(실제 카메라면 그대로)
    skip-camera-check: ${SIMAI_REPLAY_TEST_SKIP_CAMERA_CHECK:false}
  watch:
    # 워치 I4(/ws/watch, 확장 부록 C.6, S15P31A101-336, 설계 docs/design/server-watch-link.md). 워치에 주는 하트비트 주기(interval_ms,
    # 1~60초). 이 값 × 3 동안 하트비트가 없으면 끊김(LOST). 실기기는 절전 중 하트비트가 최대 27초까지 늘어나 20초(× 3 = 60초)로 둔다
    heartbeat-interval: 20s
    # watch_alert 확인 기한(ack_within_ms). 이 안에 진동 ACK 가 없으면 관리자 화면(/topic/watch)에 격상한다(S15P31A101-338)
    ack-within: 10s
    # 기한이 지난 알림을 살피는 간격
    escalation-interval: 1s
    # 움직임 대조(워치 걸음 특징 ↔ World 트랙)로 1:1 배정을 다시 계산하는 간격(S15P31A101-340). 워치가 걸음 창을 2초마다 보낸다
    match-interval: 2s
    # 시연 스위치(S15P31A101-793). 기기 ID 를 넣으면 배정과 상관없이 모든 LIVE 위험 이벤트를 그 워치로도 보낸다(사람이 하나인 시연에서
    # 걸음 대조·수동 배정을 기다리지 않게). 본 운영에서는 비운다. .env 의 SIMAI_WATCH_DEMO_DEVICE
    demo-device: ${SIMAI_WATCH_DEMO_DEVICE:}
  cctv-remote:
    # 관제 화면 CCTV 원격 시청(S15P31A101-400, 설계 docs/design/cctv-remote-view.md). 게이트웨이 영상 중계가 올린 H.264 를 저장 없이
    # 관리자 브라우저에 나눠 준다. 동시 시청 상한, 월(UTC) 송출 상한(80 GB = 80×10^9 바이트, 넘으면 모두 닫고 막음)
    max-viewers: 5
    monthly-quota-bytes: 80000000000
    # 마지막 시청자가 나가고 이만큼 뒤에도 0 이면 게이트웨이에 수요 없음(새로고침 깜빡임 방지)
    demand-linger: 15s
    # 시청 입장권 수명(한 번만)
    ticket-ttl: 60s
    # 수신·시청 모두 ping 간격, pong 없이 이만큼이면 끊는다
    ping-interval: 15s
    pong-timeout: 30s
    # 송출 사용 기록(추가만)을 남기는 간격
    usage-flush-interval: 1m
  clip:
    # 클립 삭제 작업(명세 11.5, S15P31A101-72). delete_after 가 지났고 보존 표시가 없는 클립의 객체를 지우고 deleted_at 을 쓴다
    purge-interval: PT10M
    # 클립 기록이 오지 않은 업로드 객체는 마지막 발급 만료 뒤 이만큼 지나면 지운다(클립 보관 기간과 같게)
    orphan-grant-after: 14d
  risk-engine:
    # EC2 옆 Python Risk Engine 컨테이너(PLANNED 판정 /v1/plan/evaluate, TBM 보고서 /v1/report/generate, S15P31A101-418)
    base-url: ${SIMAI_RISK_ENGINE_URL:http://risk-engine:8080}
    timeout: 90s
  coverage-guide:
    # 세팅 1단계 카메라 각도 헬퍼 중계(S15P31A101-447, 설계 docs/design/coverage-guide-relay.md). 수신 후 10 s 넘으면 STALE, 관리자 조회 후 15 s 동안 active_demand=true
    stale-after: ${SIMAI_COVERAGE_GUIDE_STALE_AFTER:10s}
    demand-ttl: ${SIMAI_COVERAGE_GUIDE_DEMAND_TTL:15s}
    # 재사용 시점 확인(S15P31A101-712) 결과를 재사용 판정 근거로 쓰는 시간
    view-check-ttl: ${SIMAI_COVERAGE_GUIDE_VIEW_CHECK_TTL:60s}
