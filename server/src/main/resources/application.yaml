spring:
  application:
    name: simai
  datasource:
    # 값은 환경 변수로 받는다. SPRING_DATASOURCE_* 가 있으면 그 값이 먼저다(CI)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/simai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # 스키마는 Flyway(V1~) 만 만든다. JPA 는 엔티티가 테이블과 맞는지 기동 때 검사만 한다
      ddl-auto: validate
  mvc:
    # 오류 본문을 ProblemDetail(detail) 로 준다. 프론트 http.ts 가 detail 을 읽는다
    problemdetails:
      enabled: true

springdoc:
  # Nginx 가 /api/ 만 서버로 넘기므로 문서도 /api/docs 아래에 둔다(설정 변경 없이 운영에서도 열린다)
  api-docs:
    path: /api/docs/openapi.json
  swagger-ui:
    path: /api/docs
  # 문서에는 /api 만 싣는다(/error 등 제외)
  paths-to-match: /api/**

simai:
  auth:
    jwt:
      # HS256 서명 키. Base64 로 32바이트 이상. 값은 환경 변수·비밀 저장소에만 둔다(명세 14)
      secret: ${SIMAI_JWT_SECRET:}
      # 짧게 두고 갱신 토큰으로 다시 받는다. 막힌 계정의 토큰이 살아 있는 시간도 이만큼이다
      access-token-ttl: 30m
    refresh-token:
      # 반장 PWA 가 관제 중 다시 로그인하지 않게 길게 둔다(명세 14, FR-35). 갱신마다 새 토큰으로 바꾼다
      ttl: 14d
      # HttpOnly 쿠키로만 주고받는다. https 가 아닌 로컬 시험(Postman 등)에서만 false 로 둔다
      cookie-secure: ${SIMAI_REFRESH_COOKIE_SECURE:true}
    # 관제 앱 개발 서버(Vite)가 다른 포트에서 부른다. 운영은 같은 출처라 비워 둔다
    cors-allowed-origins: ${SIMAI_CORS_ALLOWED_ORIGINS:}
