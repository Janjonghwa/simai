# 판은 나온 지 2주 넘은 안정판으로 고정한다(2026-11-02 기준, docs/design/watch-app.md)
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
activity-compose = "1.13.0"
wear = "1.3.0"
wear-compose = "1.7.1"
coroutines = "1.11.0"
okhttp = "5.5.0"
junit = "4.13.2"
json = "20260814"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
# 손목을 내렸을 때 어둡게 켜져 있는 화면(앰비언트 모드). Wear OS 3 이상 워치에서 모두 동작하는 AmbientLifecycleObserver
androidx-wear = { module = "androidx.wear:wear", version.ref = "wear" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wear-compose" }
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wear-compose" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }
# JVM 단위 시험용 org.json 실제 구현(android.jar 의 org.json 은 비어 있다)
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
