[project]
name = "simai-relay"
version = "0.1.0"
description = "simai 노트북 영상 중계: 카메라별 RTSP 압축 프레임 수신, I0 촬영 시각 헤더(S15P31A101-80), 카메라별 TLS 전송(S15P31A101-83), CCTV 로컬 미리보기(S15P31A101-310)"
requires-python = ">=3.11,<3.12"
# simai-recorder: RTSP·파일·합성 입력(PyAV, 디코딩 없음), 촬영 시각 추정(capture_time), I0 헤더·코덱 정보 만들기(i0)를
# 녹화 도구와 같은 코드로 쓴다(중복 구현하지 않는다). 저장소 안 경로 의존이다.
# simai-site-alert: Tier 0 엔드포인트 조회(endpoint)와 TLS 공개키 고정(pinning)을 현장 경보 단말과 같은 코드로 쓴다
# (S15P31A101-159, 중복 구현하지 않는다). 저장소 안 경로 의존이다.
# websockets: 관제 앱 CCTV 로컬 미리보기 서버(127.0.0.1, S15P31A101-310). 현장 경보 단말이 이미 쓰는 것과 같은 판을 직접 적는다.
dependencies = ["simai-recorder", "simai-site-alert", "websockets>=14"]

[project.scripts]
simai-relay = "simai_relay.cli:main"

[tool.uv.sources]
simai-recorder = { path = "../recorder", editable = true }
simai-site-alert = { path = "../site_alert", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    # TLS 시험: 시험 중에 자체 서명 인증서를 만든다(커밋하지 않음). 전송 비교 측정(bench)도 인증서를 주지 않으면 이것으로 만든다.
    "cryptography>=43",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
