# 로비 카메라 4대 영상 중계 설정 (공유기 DHCP 예약 사설 IP, S15P31A101-393). 게이트웨이 도우미(gateway/ops)가 기본으로 쓴다.
# 카메라 계정은 여기에 쓰지 않는다. 저장소 루트 .env 의 RTSP_USER_CAM_A~D / RTSP_PASS_CAM_A~D 를 읽는다. C110 은 RTSP 동시 접속이 2세션이다.
# C110 은 RTSP 동시 접속이 2세션이다. 중계와 녹화 도구를 같은 카메라에 함께 붙이면 Tapo 앱·VLC 로는 더 붙지 못한다.

[capture_time]                                      # 4대 공통 촬영 시각 추정 (G0 LED 시험 전 잠정값, 명세 3.9)
timestamp_source = "RECEIVE_ESTIMATED"
latency_ms = 0
uncertainty_ms = 20
uncertainty_no_pts_ms = 45
window_ms = 30000

[[cameras]]
camera_id = "cam_A"
kind = "rtsp"
host = "192.168.0.21"
path = "stream1"

[[cameras]]
camera_id = "cam_B"
kind = "rtsp"
host = "192.168.0.20"
path = "stream1"

[[cameras]]
camera_id = "cam_C"
kind = "rtsp"
host = "192.168.0.22"
path = "stream1"

[[cameras]]
camera_id = "cam_D"
kind = "rtsp"
host = "192.168.0.19"
path = "stream1"
