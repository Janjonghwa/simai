# 카메라 없이 중계 경로를 점검하는 설정: 합성 스트림 4대(지연·멈춤·끊김 흉내). 결과를 제품 성능에 쓰지 않는다.
#   uv run simai-relay run --config configs/dry-run.toml --seconds 30

[[cameras]]
camera_id = "cam_A"
kind = "synthetic"
width = 640
height = 360
fps = 25

[[cameras]]
camera_id = "cam_B"
kind = "synthetic"
width = 640
height = 360
faults = { jitter_ms = 40, stalls = { 100 = 350 }, seed = 1 }   # Wi-Fi 도착 지터, 350ms 멈춤

[[cameras]]
camera_id = "cam_C"
kind = "synthetic"
width = 640
height = 360
faults = { disconnect_after = [200, 300], failed_reopens = 1 }   # 두 번 끊기고, 다시 열기 1번 실패

[[cameras]]
camera_id = "cam_D"
kind = "synthetic"
width = 640
height = 360
# 로컬 영상으로 바꾸려면 위 두 줄 대신:
# kind = "file"
# file = "C:/path/to/video.mp4"   # H.264 (raw .h264, MP4, MKV). 사람이 찍힌 영상은 쓰지 않는다
# loop = true
