[project]
name = "simai-camera-helper"
version = "0.1.0"
description = "CPU camera overlap guidance; no calibration or safety decisions"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.7.1", "torchvision==0.22.1", "numpy>=2.0,<3",
  "opencv-python-headless>=4.11,<5", "av>=14,<17", "lightglue",
  "psutil>=6,<8",
]

[project.scripts]
simai-camera-helper = "simai_camera_helper.offline:main"

[tool.uv]
# LightGlue declares the GUI distribution; only its cv2 API is needed on this worker.
exclude-dependencies = ["opencv-python"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
lightglue = { git = "https://github.com/cvg/LightGlue.git", rev = "5a650c444718caffc2669dc0094cde908f42dd73" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8.3,<10", "jsonschema>=4.23", "ruff>=0.11"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "-m", "not weights"]
markers = ["weights: requires explicitly supplied local ALIKED/LightGlue weights and session11 data"]

[tool.ruff]
line-length = 110
