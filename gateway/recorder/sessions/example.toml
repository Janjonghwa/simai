# 녹화 세션 설정 예시 (S15P31A101-107). 복사해서 시나리오마다 하나씩 만든다.
# 카메라 계정은 여기에 쓰지 않는다. 저장소 루트 .env 의 RTSP_USER / RTSP_PASS 를 읽는다(.env.example 참고).

[session]
scenario = "empty_room_10min"                       # 명세 15.3 시나리오 이름 (영문 소문자·숫자·_·-)
description = "사람 없는 교실 10분 시험 녹화"
storage_uri = "volume://AP-JP-1/simai/recordings"   # 올릴 Network Volume 위치. 세션 ID 가 뒤에 붙는다
# calibration_version = "cal-3"                     # 이 녹화에 쓸 보정 버전(있으면)
# session_id = "rec-20261020-090000z-empty-room"    # 없으면 rec-<UTC 시각>z-<시나리오>
notes = ""

[consent]                                           # 명세 11.5. RTSP 녹화는 이 절이 없으면 시작하지 않는다
contains_people = false                             # 사람이 찍히면 true 로 바꾸고 아래 두 값을 채운다(동의 받은 시나리오 촬영)
# purpose = "dev_test"                             # 수업 중 우연히 찍힌 영상(내부 개발·테스트 전용): consent_ref·scope 없이 가능, retention_until 필수.
#                                                 # 커밋 금지, 노트북·Network Volume 에만 두고 프로젝트 종료 시 삭제. 시연·발표·보고서·공개 자료 사용 금지.
#                                                 # 시나리오 촬영은 "dataset"(또는 생략)이며 동의서 필수. 용도 없이 사람이 있으면 시작하지 않는다
# consent_ref = "CF-2026-10-001"                    # 참여자 동의서 문서 ID (저장소 밖 보관)
# scope = ["dataset_internal", "runpod_ap_jp_1"]    # 동의 범위: 용도·전송 리전 (docs/data/recording-manifest.md)
retention_until = "2027-01-31"                      # 이 날짜가 지나면 Network Volume 에서 지운다

[capture_time]                                      # 4대 공통 촬영 시각 추정 (G0 LED 시험 전 잠정값)
timestamp_source = "RECEIVE_ESTIMATED"              # C110 기본값 (명세 3.9)
latency_ms = 0
uncertainty_ms = 20
uncertainty_no_pts_ms = 45
window_ms = 30000

# Tapo C110 4대. host 는 공유기에서 고정 IP 로 잡는다. firmware 는 Tapo 앱에서 확인해 적는다(모르면 지운다).
[[cameras]]
camera_id = "cam_A"
kind = "rtsp"
host = "192.168.0.11"
path = "stream1"
# firmware = "1.x.x Build ..."

[[cameras]]
camera_id = "cam_B"
kind = "rtsp"
host = "192.168.0.12"
path = "stream1"

[[cameras]]
camera_id = "cam_C"
kind = "rtsp"
host = "192.168.0.13"
path = "stream1"

[[cameras]]
camera_id = "cam_D"
kind = "rtsp"
host = "192.168.0.14"
path = "stream1"
