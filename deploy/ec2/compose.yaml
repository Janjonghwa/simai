# EC2 운영 스택 (S15P31A101-66). 절차: docs/design/ec2-deploy.md
#   docker buildx bake ec2                                                              # 저장소 최상위에서 server·web·risk-engine 이미지
#   docker compose --env-file /opt/simai/.env -f deploy/ec2/compose.yaml up -d          # 띄우기
#   docker compose --env-file /opt/simai/.env -f deploy/ec2/compose.yaml run --rm server admin create-user --login <아이디> --role ADMIN
# 비밀 값은 서버의 /opt/simai/.env(권한 600)에만 둔다. 키 이름은 deploy/ec2/.env.example
# 망: edge(web·server·jenkins, 밖으로 나갈 수 있음), ec2-internal(server·db·risk-engine, 밖으로 못 나감),
#     ci(jenkins·ci-db, 밖으로 못 나감. 운영 DB 와 분리). 공개 포트는 web 의 80·443 뿐이다
name: simai-ec2

services:
  web:
    image: ${SIMAI_REGISTRY:-simai}/web:${SIMAI_TAG:-dev}
    ports: ["80:80", "443:443"]
    environment:
      SIMAI_DOMAIN: ${SIMAI_DOMAIN:?SIMAI_DOMAIN}
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks: [edge]
    restart: unless-stopped

  # 인증서 갱신만 한다(처음 발급은 절차 문서). 12시간마다 확인하고 만료 30일 전부터 갱신한다. web 이 6시간마다 다시 읽는다
  certbot:
    # certbot/certbot:v5.8.0
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    restart: unless-stopped

  server:
    image: ${SIMAI_REGISTRY:-simai}/server:${SIMAI_TAG:-dev}
    environment:
      DB_URL: jdbc:postgresql://db:5432/simai
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
      SIMAI_JWT_SECRET: ${SIMAI_JWT_SECRET:?SIMAI_JWT_SECRET}
      # 비어 있으면 Tier 0 I1(/ws/tier0) 연결만 거부되고 서버는 뜬다(Tier 0 를 붙이기 전 배포)
      SIMAI_TIER0_TOKEN_SHA256: ${SIMAI_TIER0_TOKEN_SHA256:-}
      # Tier 0 가 구성 묶음을 내려받는 주소(S15P31A101-120). Nginx 가 /api/ 를 서버로 넘긴다
      SIMAI_PUBLIC_BASE_URL: https://${SIMAI_DOMAIN:?SIMAI_DOMAIN}
      # Nginx 가 넘긴 X-Forwarded-* 로 원래 주소(https)를 안다
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # 객체 저장소(S15P31A101-69). 버킷이 비면 서버는 뜨고 업로드·조회 서명만 503 이다.
      # EC2 가 SSAFY 제공이라 인스턴스 역할을 붙일 수 없어 IAM 사용자의 정적 키를 쓴다(버킷 객체 권한만)
      SIMAI_STORAGE_BUCKET: ${SIMAI_STORAGE_BUCKET:-}
      SIMAI_STORAGE_REGION: ${SIMAI_STORAGE_REGION:-ap-northeast-2}
      SIMAI_STORAGE_ACCESS_KEY: ${SIMAI_STORAGE_ACCESS_KEY:-}
      SIMAI_STORAGE_SECRET_KEY: ${SIMAI_STORAGE_SECRET_KEY:-}
      # 시연용 기본 장면(배경 glTF)의 버킷 객체 키(S15P31A101-264). Scene 생성 전까지 GET /api/scenes/current 가 이 객체를 준다.
      # 비우면 그 조회만 404 SCENE_NOT_FOUND 이고 배경이 안 뜬다
      SIMAI_SCENE_DEFAULT_GLTF_KEY: ${SIMAI_SCENE_DEFAULT_GLTF_KEY:-}
    networks: [edge, ec2-internal]
    depends_on:
      db:
        condition: service_healthy
    # 포트가 열렸는지만 본다. /actuator/health 는 아직 인증이 필요하다(SecurityConfig)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    restart: unless-stopped

  # 명세 11.1: timescaledb-ha -all (TimescaleDB·PostGIS). 스키마는 server 의 Flyway 가 기동 때 만든다
  db:
    # timescale/timescaledb-ha:pg17-all
    image: timescale/timescaledb-ha:pg17-all@sha256:26e355e055c97d0a51afc415b71fa728dd85664fb24165d595cc8cd0c485b2fc
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
      POSTGRES_DB: simai
    volumes:
      - db-data:/home/postgres/pgdata
    networks: [ec2-internal]
    shm_size: 256m
    healthcheck:
      # 초기화 중의 임시 서버는 TCP 를 듣지 않으므로 127.0.0.1 로 묻는다
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "simai"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 4g
    restart: unless-stopped

  risk-engine:
    extends:
      file: ../compose.yaml
      service: risk-engine
    image: ${SIMAI_REGISTRY:-simai}/risk-engine:${SIMAI_TAG:-dev}

  # CI(S15P31A101-28). 이미지는 따로 빌드한다: TAG=... docker buildx bake jenkins, 태그는 SIMAI_JENKINS_TAG.
  # 검사는 이 컨테이너 안에서 직접 돈다. 호스트 Docker 소켓·운영 DB·/opt/simai/.env 를 받지 않는다(docs/design/ci-pipeline.md).
  # 화면은 Nginx /jenkins 뒤에 있고 로그인한 관리자만 쓴다
  jenkins:
    image: ${SIMAI_REGISTRY:-simai}/jenkins:${SIMAI_JENKINS_TAG:-dev}
    environment:
      JENKINS_OPTS: --prefix=/jenkins
      JAVA_OPTS: -Xmx1g -Djava.awt.headless=true
    volumes:
      - jenkins-home:/var/jenkins_home
    networks: [edge, ci]
    # 자동 배포(S15P31A101-254): 호스트 sshd 로 deploy.sh 만 실행하는 제한 키를 쓴다
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 4g
    restart: unless-stopped

  # 서버 시험 전용 DB(운영 db 와 같은 이미지). Jenkinsfile 이 빌드마다 시험 DB 를 지우고 새로 만든다.
  # 비밀번호는 ci 망 안에서만 닿는 일회용 시험 DB 용이라 비밀 값이 아니다
  ci-db:
    # timescale/timescaledb-ha:pg17-all
    image: timescale/timescaledb-ha:pg17-all@sha256:26e355e055c97d0a51afc415b71fa728dd85664fb24165d595cc8cd0c485b2fc
    environment:
      POSTGRES_PASSWORD: simai-ci
      # 이미지가 메모리(1 GB)로 자동 조정하면 25 라, Spring 시험 컨텍스트 여러 개의 연결 풀이 넘친다(too many clients)
      TS_TUNE_MAX_CONNS: "100"
    networks: [ci]
    shm_size: 256m
    mem_limit: 1g
    restart: unless-stopped

networks:
  edge: {}
  ec2-internal:
    name: simai-ec2-internal
    internal: true
  ci:
    internal: true

volumes:
  db-data:
  letsencrypt:
  certbot-www:
  jenkins-home:
