[project]
name = "simai-ai"
version = "0.1.0"
description = "simai AI 파트: Tier 0 파이프라인, Risk Engine, 작업 서버 기능 패키지"
requires-python = ">=3.11,<3.12"
# 기본 설치는 비워 둔다. EC2 컨테이너는 extras 없이 Risk Engine(simai_ai.risk)만 쓴다.
dependencies = []

[project.optional-dependencies]
# 무거운 의존성은 기능별로 나눈다. torch 판은 tier0·hmr 이 vLLM 0.21.0 과 같은 판으로 고정한다(Linux 는 PyPI cu130 휠, S15P31A101-235).
# pyarrow: 2D 관측(observation_2d) Parquet 보관 (simai_ai.io.obs2d_parquet, 명세 11.2)
# av(PyAV): Tier 0 I0 압축 프레임 디코딩 (simai_ai.io.pyav_decoder: CPU, Pod 는 hwaccel cuda = NVDEC, 명세 5.1)
io = ["opencv-python-headless>=4.9", "pyarrow>=17", "av>=14"]
# lap: ultralytics.trackers 가 import 시점에 요구한다(없으면 런타임에 pip 자동 설치를 시도한다)
# ultralytics 8.4.178 이상: TrackTrack 추적기와 추적기 인스턴스별 ID 카운터에 기댄다
# OpenCV 는 headless 하나만 쓴다(ultralytics 가 선언한 opencv-python 은 [tool.uv] override 로 뺀다. 같은 cv2 폴더를 덮어쓰는 두 휠을 막는다, S15P31A101-235)
detection = ["ultralytics>=8.4.178,<8.5", "lap>=0.5.12", "opencv-python-headless>=4.9"]
geometry = ["numpy>=1.26"]
# jsonschema: 보정 버전 저장소가 저장 전에 contracts/providers/calibration.schema.json 으로 직접 검증한다
# scipy: 사람 keypoint 번들 조정(simai_ai.calibration.bundle)의 희소 행렬·연결 성분·회전 계산
calibration = ["numpy>=1.26", "opencv-python-headless>=4.9", "jsonschema>=4.23", "scipy>=1.11"]
# 정적 장면: BEV(simai_ai.scene, numpy) + MapAnything 일회성 장면 준비(S15P31A101-250, docs/design/unified-env.md "3단계").
#   map-anything @3d10cf7 자체는 잠금 밖(이미지가 커밋으로 받아 --no-deps). 아래는 그 pyproject 의 dependencies 중 추론 경로
#   (mapanything.models·utils.geometry·utils.image·utils.viz, ai/experiments/static_scene/run_mapanything.py)가 import 하는 것이다.
#   뺀 것: tensorboard·natsort(추론 경로에서 쓰지 않음, tensorboard 는 학습 코드 train/ 에서만), orjson·python-box(학습 데이터셋 wai 만), pillow-heif(HEIF 입력 선택 import).
#   opencv-python-headless==4.10.0.84 고정은 Tier 0 판(>=4.9)으로 합쳤다. scipy 는 utils.viz 가 import 하는데 map-anything 이 선언하지 않아 적었다.
#   rerun-sdk 는 utils.viz 가 모듈 수준에서 import 하고 uniception 도 선언한다(map-anything 고정 ~=0.24.1 그대로).
scene = [
    "torch==2.11.0",
    "uniception==0.1.7; sys_platform == 'linux'",
    "rerun-sdk~=0.24.1; sys_platform == 'linux'",
    "huggingface-hub; sys_platform == 'linux'",
    "hydra-core; sys_platform == 'linux'",
    "safetensors; sys_platform == 'linux'",
    "opencv-python-headless>=4.9; sys_platform == 'linux'",
    "matplotlib; sys_platform == 'linux'",
    "scipy; sys_platform == 'linux'",
    "plyfile; sys_platform == 'linux'",
    "requests; sys_platform == 'linux'",
    "tqdm; sys_platform == 'linux'",
    "trimesh>=4.11; sys_platform == 'linux'",
]
# HMR(Fast SAM 3D Body @d72aa36) 실행 의존성. deploy/exp02/requirements.in 에서 옮겼다(S15P31A101-235, docs/design/unified-env.md).
#   torch 는 Tier 0·vLLM 과 같은 판(한 가상환경). Linux GPU 에서만 돌므로 torch 밖은 모두 Linux 전용이다.
#   추론에 안 쓰는 것은 뺐다: tensorboard·black(Detectron2 의 기록기·설정 저장에서만), pytest, seaborn, hydra-submitit-launcher, pip(chumpy 빌드 단계 전용).
#   opencv-python 은 headless 로 합쳤고 websockets==14.1 고정은 >=14 로 풀었다.
#   잠금 밖(uv sync 뒤 --no-deps 휠): chumpy 0.70, detectron2 @a1ce2f9(FORCE_CUDA=0), moge @74fbce0. 순서는 설계 문서 "설치 순서".
hmr = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "pytorch-lightning; sys_platform == 'linux'",
    "pyrender; sys_platform == 'linux'",
    "opencv-python-headless>=4.9; sys_platform == 'linux'",
    "yacs; sys_platform == 'linux'",
    "scikit-image; sys_platform == 'linux'",
    "einops; sys_platform == 'linux'",
    "timm; sys_platform == 'linux'",
    "dill; sys_platform == 'linux'",
    "pandas; sys_platform == 'linux'",
    "rich; sys_platform == 'linux'",
    "hydra-core; sys_platform == 'linux'",
    "hydra-colorlog; sys_platform == 'linux'",
    "pyrootutils; sys_platform == 'linux'",
    "webdataset; sys_platform == 'linux'",
    "networkx==3.2.1; sys_platform == 'linux'",
    "roma; sys_platform == 'linux'",
    "joblib; sys_platform == 'linux'",
    "appdirs; sys_platform == 'linux'",
    "ffmpeg; sys_platform == 'linux'",
    "cython; sys_platform == 'linux'",
    "jsonlines; sys_platform == 'linux'",
    "xtcocotools; sys_platform == 'linux'",
    "loguru; sys_platform == 'linux'",
    "optree; sys_platform == 'linux'",
    "fvcore; sys_platform == 'linux'",
    "pycocotools; sys_platform == 'linux'",
    "huggingface-hub; sys_platform == 'linux'",
    "setuptools<81; sys_platform == 'linux'",
    "smplx; sys_platform == 'linux'",
    "numpy>=2; sys_platform == 'linux'",
    "scipy; sys_platform == 'linux'",
    "tqdm; sys_platform == 'linux'",
    "pyzmq; sys_platform == 'linux'",
    "plyfile; sys_platform == 'linux'",
    "trimesh>=4.11; sys_platform == 'linux'",
    "websockets>=14; sys_platform == 'linux'",
    "ultralytics>=8.4.178,<8.5; sys_platform == 'linux'",
    # MoGe @74fbce0 의 실행 의존성(flex-gemm·gradio 는 뺀다: triton 판 충돌과 데모 앱 전용)
    "click>=8.3.1; sys_platform == 'linux'",
    "requests; sys_platform == 'linux'",
    "utils3d-moge; sys_platform == 'linux'",
    "pipeline; sys_platform == 'linux'",
    # detectron2 @a1ce2f9 의 실행 의존성(detectron2 자체는 --no-deps)
    "pillow>=7.1; sys_platform == 'linux'",
    "matplotlib; sys_platform == 'linux'",
    "termcolor>=1.1; sys_platform == 'linux'",
    "tabulate; sys_platform == 'linux'",
    "cloudpickle; sys_platform == 'linux'",
    "iopath>=0.1.7,<0.1.10; sys_platform == 'linux'",
    "omegaconf>=2.1,<2.4; sys_platform == 'linux'",
    "packaging; sys_platform == 'linux'",
    # chumpy 0.70 의 실행 의존성
    "six; sys_platform == 'linux'",
]
# VLM 서빙(vLLM OpenAI 호환 서버 + Cosmos3 플러그인, Cosmos3-Nano Reasoner, 명세 3.2·3.8·5.4). vllm 0.21.0 이 torch==2.11.0·torchvision==0.26.0·flashinfer 0.6.8.post1 을 고정한다.
#   Linux GPU 전용. vllm-cosmos3·transformers-cosmos3 는 PyPI 에 없어 cosmos-framework 커밋을 고정한다([tool.uv.sources]).
vlm = [
    "vllm==0.21.0; sys_platform == 'linux'",
    "flashinfer-python==0.6.8.post1; sys_platform == 'linux'",
    "vllm-cosmos3; sys_platform == 'linux'",
    "transformers-cosmos3; sys_platform == 'linux'",
]
# RAG 조항 임베딩(BAAI/bge-m3 dense, 명세 5.4·11장, S15P31A101-27, docs/design/rag-clause-index.md). 노트북 CPU 에서 돌린다.
#   torch·transformers 는 한 가상환경의 판(torch 2.11.0, transformers 는 VLM 쪽 상한 <5.10 안의 잠금 판)과 같게 고정해 문서·질문 임베딩 환경을 하나로 둔다.
rag = ["torch==2.11.0", "transformers==5.9.0"]
# 배포 단위 묶음 (services/)
# websockets: I1 WebSocket(wss) 클라이언트 (services/tier0/i1_client, 명세 12.2)
# torch·torchvision: Tier 0·분석 워커·vLLM 이 한 가상환경을 쓰므로 vllm 0.21.0 이 고정한 판으로 묶는다(S15P31A101-235). PyPI 의 Linux 휠이 CUDA 13.0 빌드다.
# TensorRT·onnx: Tier 0 이미지(Linux GPU)에서 YOLO26x-pose TensorRT FP16 엔진을 Pod 첫 기동 때 만들고 쓴다(명세 3.12, deploy/tier0).
#   torch 휠이 CUDA 13 이므로 cu13 빌드를 쓴다. libs 휠은 pypi.nvidia.com 에만 있다(PyPI 에는 내려받기용 sdist 만).
#   Windows 노트북 개발 환경에는 설치하지 않는다(marker).
# nvidia-modelopt[onnx]: ultralytics 8.4.178 TensorRT 내보내기의 FP16 변환(ModelOpt AutoCast)이 요구한다. 0.47 이 onnx<1.22 를 요구한다.
#   Tier 0 핵심 판은 상·하한을 둬 워커 패키지 변경에 끌려가지 않게 한다(판 고정 표: docs/design/unified-env.md)
tier0 = [
    "simai-ai[io,detection,geometry,calibration]",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "websockets>=14",
    "tensorrt-cu13>=11.4,<12; sys_platform == 'linux'",
    "tensorrt-cu13-libs>=11.4,<12; sys_platform == 'linux'",
    "tensorrt-cu13-bindings>=11.4,<12; sys_platform == 'linux'",
    "onnx>=1.21,<1.22; sys_platform == 'linux'",
    "nvidia-modelopt[onnx]>=0.47,<0.48; sys_platform == 'linux'",
    # ModelOpt AutoCast 의 ONNX 참조 실행용 CPU 판. modelopt[onnx] 가 x86 에서 선언한 onnxruntime-gpu·cupy-cuda12x(CUDA 12 빌드라 cu13 환경에서
    # GPU 로 못 뜬다)는 [tool.uv] override 로 뺀다(S15P31A101-246, docs/design/unified-env.md "2단계")
    "onnxruntime>=1.24,<1.25; sys_platform == 'linux'",
]
worker = ["simai-ai[scene,hmr,vlm]"]
# EC2 Risk Engine 컨테이너 내부 API (services/risk_engine, deploy/risk-engine, 명세 3.2·3.8·12.2). 요청·응답은 contracts/ 스키마로
# jsonschema 검증한다(손으로 쓴 Pydantic 모델 없음, 명세 21.2). 판은 올린 지 2주가 지난 것으로 묶는다(공급망. 올릴 때 MR 에 적는다)
risk_api = ["fastapi>=0.142.4,<0.143", "starlette>=1.7,<1.8", "uvicorn>=0.54,<0.55", "jsonschema>=4.23"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "import-linter>=2.1",
    "jsonschema>=4.23",
    # geometry 시험(삼각측량)용. 기능 설치는 extras geometry 가 같은 범위를 선언한다
    "numpy>=1.26",
    # 2D 관측 Parquet 시험용. 기능 설치는 extras io 가 같은 범위를 선언한다
    "pyarrow>=17",
    # Tier 0 LIVE 입력 시험: 시험 안에서 H.264 를 만들고 CPU 로 디코딩한다(영상은 커밋하지 않음). extras io 와 같은 범위
    "av>=14",
    # 번들 조정 시험용. 기능 설치는 extras calibration 이 같은 범위를 선언한다
    "scipy>=1.11",
    # I0 영상 수신 TLS 시험: 시험 중에 자체 서명 인증서를 만든다(커밋하지 않음). 실행 시에는 쓰지 않는다
    "cryptography>=43",
    # I1 클라이언트 시험(로컬 wss 서버). 기능 설치는 extras tier0 가 같은 범위를 선언한다
    "websockets>=14",
    # Risk Engine 컨테이너 API 시험(fastapi.testclient 가 httpx 를 쓴다, 실제 서버 왕복은 uvicorn). 기능 설치는 extras risk_api 가 같은 범위를 선언한다
    "fastapi>=0.142.4,<0.143",
    "httpx>=0.28",
    "uvicorn>=0.54,<0.55",
    # contracts/ 스키마 → pydantic v2 모델 생성(contracts/scripts/generate_python_models.py, 명세 21.2).
    # 생성 결과가 판마다 달라 판을 고정한다(올린 지 2주가 지난 판). 모델(simai_ai.contracts.models)은 pydantic 이 있어야 import 된다
    "datamodel-code-generator==0.83.0",
    "pydantic>=2.14,<3",
]

[tool.uv]
# ultralytics 가 선언한 opencv-python(GUI 판)을 빼고 headless 하나로 통일한다(두 휠이 같은 cv2 폴더를 덮어쓴다, pyrender EGL 과 Qt/X11 번들 충돌 후보)
# onnxruntime-gpu·cupy-cuda12x: modelopt[onnx] 의 CUDA 12 빌드 의존성. 우리 경로(FP16 AutoCast)는 CPU onnxruntime 으로 돌고 cupy 는 쓰지 않는다(S15P31A101-246)
override-dependencies = [
    "opencv-python; sys_platform == 'never'",
    "onnxruntime-gpu; sys_platform == 'never'",
    "cupy-cuda12x; sys_platform == 'never'",
]
# vLLM 0.21.0 은 아래 패키지의 상한을 두지 않는다. 최신 판(openai 3·anthropic 2·mcp 2·transformers 5.20·2026-10-09 triton 포크)은 vLLM 0.21 이 나온 뒤의 판이라
# vllm-cosmos3 자체 잠금(cosmos-framework packages/vllm-cosmos3/uv.lock)·vLLM 0.21.0 CI 잠금과 같은 메이저·마이너로 묶는다(VLM 쪽만 쓰는 패키지, Linux 전용)
constraint-dependencies = [
    "transformers>=5.5.3,<5.10; sys_platform == 'linux'",
    "openai<3; sys_platform == 'linux'",
    "anthropic<1; sys_platform == 'linux'",
    "mcp<2; sys_platform == 'linux'",
    "tokenspeed-triton==3.7.10.post20260505; sys_platform == 'linux'",
]

[tool.uv.sources]
tensorrt-cu13-libs = { index = "nvidia" }
# cosmos-framework "Release 2026-09-23"(올린 지 2주가 지난 커밋). 두 플러그인 폴더는 2026-06-01·09-17 뒤로 바뀌지 않았다
vllm-cosmos3 = { git = "https://github.com/NVIDIA/cosmos-framework.git", subdirectory = "packages/vllm-cosmos3", rev = "cf5d68c00d97ccd2480a2320ed652b92dec63102" }
transformers-cosmos3 = { git = "https://github.com/NVIDIA/cosmos-framework.git", subdirectory = "packages/transformers-cosmos3", rev = "cf5d68c00d97ccd2480a2320ed652b92dec63102" }
utils3d-moge = { git = "https://github.com/EasternJournalist/utils3d-moge.git", rev = "62f09d58509485564e24d5d9f6aac9ee9ebc0c37" }
pipeline = { git = "https://github.com/EasternJournalist/pipeline.git", rev = "1c511390d90226c00c101f34b84df26a0f8789b4" }

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]
markers = [
    "gpu: GPU가 있어야 도는 테스트 (CI는 GPU 없이 돈다)",
]

# 의존 방향 검사: ai/ 에서 `uv run lint-imports`
# services 는 설치 대상이 아니라 ai/ 를 작업 디렉터리로 두고 찾는다.
[tool.importlinter]
root_packages = ["simai_ai", "services"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "risk-isolated"
name = "risk 는 다른 기능 패키지를 import 하지 않는다 (contracts 생성 타입만 허용)"
type = "forbidden"
source_modules = ["simai_ai.risk"]
# simai_ai 의 하위 패키지 중 risk, contracts 를 뺀 전부. 새 기능 패키지를 만들면 여기에 넣는다
# (tests/architecture 가 빠진 패키지를 잡는다). 아래 서드파티는 기본 설치에 없으므로 함께 막는다.
forbidden_modules = [
    "simai_ai.io",
    "simai_ai.detection",
    "simai_ai.tracking",
    "simai_ai.geometry",
    "simai_ai.contact",
    "simai_ai.calibration",
    "simai_ai.scene",
    "simai_ai.hmr",
    "simai_ai.vlm",
    "simai_ai.providers",
    "simai_ai.config",
    "simai_ai.eventlog",
    "simai_ai.recovery",
    "simai_ai.gpu",
    "simai_ai.rag",
    "numpy",
    "cv2",
    "torch",
    "ultralytics",
    "jsonschema",
    "referencing",
    "pyarrow",
    "scipy",
    "av",
    # contracts 생성 모델(simai_ai.contracts.models)은 pydantic 이 필요해 기본 설치의 risk 가 거쳐서도 불러오지 않는다
    "pydantic",
]

[[tool.importlinter.contracts]]
id = "tier0-no-worker-stack"
name = "Tier 0 경로(services.tier0 와 그 simai_ai 모듈)는 분석 워커·VLM 스택(vLLM·Transformers·Detectron2·MoGe·pyrender 등)을 import 하지 않는다 (한 가상환경이라 설치돼 있어도 막는다, S15P31A101-235, 명세 3.2)"
type = "forbidden"
source_modules = [
    "services.tier0",
    "simai_ai.io",
    "simai_ai.detection",
    "simai_ai.tracking",
    "simai_ai.geometry",
    "simai_ai.contact",
    "simai_ai.calibration",
    "simai_ai.risk",
    "simai_ai.config",
    "simai_ai.eventlog",
    "simai_ai.recovery",
    "simai_ai.gpu",
    "simai_ai.providers",
]
forbidden_modules = [
    "vllm",
    "vllm_cosmos3",
    "transformers",
    "transformers_cosmos3",
    "flashinfer",
    "detectron2",
    "moge",
    "pyrender",
    "smplx",
    "pytorch_lightning",
    # 잠금 밖 휠(chumpy)과 MoGe 의존성(utils3d-moge 의 모듈 utils3d)
    "chumpy",
    "utils3d",
    # MapAnything 장면 준비 스택(잠금 밖 map-anything, 그 인코더 uniception, 시각화 rerun-sdk 의 모듈 rerun, S15P31A101-250)
    "mapanything",
    "uniception",
    "rerun",
    # 우리 분석 워커 쪽 패키지(이들을 거치면 워커 스택이 따라온다)
    "simai_ai.vlm",
    "simai_ai.hmr",
    "simai_ai.scene",
    "simai_ai.rag",
    "services.worker",
]

[[tool.importlinter.contracts]]
id = "no-experiments"
name = "src 와 services 는 experiments 를 import 하지 않는다"
type = "forbidden"
source_modules = ["simai_ai", "services"]
forbidden_modules = ["experiments"]

[[tool.importlinter.contracts]]
id = "no-gateway"
name = "src 와 services 는 gateway 패키지(노트북 중계·녹화·현장 경보)를 import 하지 않는다"
type = "forbidden"
